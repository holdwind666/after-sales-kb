name: validate

on:
  push:
  pull_request:

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fresh-install smoke test
        shell: powershell
        run: .\tests\smoke.ps1
